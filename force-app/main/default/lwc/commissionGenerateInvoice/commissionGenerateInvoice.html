<template>
    <lightning-card title="Commission Invoice" icon-name="standard:applied_amount">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template lwc:if={loading}>
                <div class="slds-p-around_medium slds-align_absolute-center">
                    <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:elseif={hasContext}>
                <div class="slds-grid slds-wrap slds-gutters_small slds-p-bottom_medium">
                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Commission Number</div>
                        <div class="field-value">
                            <a href="javascript:void(0)" onclick={handleCommissionClick} class="commission-link">{commissionName}</a>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Status</div>
                        <div class="field-value">
                            <span class={statusBadgeClass}>{status}</span>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Agency</div>
                        <div class="field-value">{agencyDisplay}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Commission Rate</div>
                        <div class="field-value">{rateDisplay}</div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Commission Amount</div>
                        <div class="field-value">
                            <lightning-formatted-number
                                value={commissionAmount}
                                format-style="currency"
                                currency-code={currencyCode}
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">VAT Amount</div>
                        <div class="field-value">
                            <lightning-formatted-number
                                value={vatAmount}
                                format-style="currency"
                                currency-code={currencyCode}
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Payment Method</div>
                        <div class="field-value">{paymentMethodDisplay}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Total Commission Amount</div>
                        <div class="field-value amount-emphasis">
                            <lightning-formatted-number
                                value={totalCommissionAmount}
                                format-style="currency"
                                currency-code={currencyCode}
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Paid Amount</div>
                        <div class="field-value">
                            <lightning-formatted-number
                                value={paidAmount}
                                format-style="currency"
                                currency-code={currencyCode}
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-vertical_x-small">
                        <div class="field-label">Remaining Amount</div>
                        <div class="field-value amount-emphasis">
                            <lightning-formatted-number
                                value={remainingAmount}
                                format-style="currency"
                                currency-code={currencyCode}
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </div>
                    </div>
                </div>

                <div class="action-row">
                    <template lwc:if={canGenerate}>
                        <lightning-button
                            variant="brand"
                            label="Generate Invoice"
                            icon-name="utility:new"
                            onclick={handleGenerate}
                            disabled={generating}
                            class="slds-m-right_x-small">
                        </lightning-button>
                    </template>

                    <template lwc:if={canMarkPaid}>
                        <lightning-button
                            variant="brand"
                            label="Record Payment"
                            icon-name="utility:moneybag"
                            onclick={handleMarkPaid}
                            disabled={generating}
                            class="slds-m-right_x-small">
                        </lightning-button>
                    </template>

                    <template lwc:if={hasInvoice}>
                        <lightning-button
                            variant="neutral"
                            label="View Invoice"
                            icon-name="utility:open"
                            onclick={navigateToInvoice}
                            class="slds-m-right_x-small">
                        </lightning-button>
                    </template>

                    <template lwc:if={hasNoActions}>
                        <p class="slds-text-body_small slds-text-color_weak">
                            No actions available &mdash; status is "{status}".
                        </p>
                    </template>
                </div>
            </template>

            <template lwc:else>
                <template lwc:if={hasIneligibilityReasons}>
                    <div class="empty-state">
                        <lightning-icon icon-name="utility:warning" size="x-small" class="slds-p-right_x-small" variant="warning"></lightning-icon>
                        <span class="slds-text-body_small">Unit is not eligible for commission:</span>
                    </div>
                    <ul class="reasons-list">
                        <template for:each={ineligibilityReasons} for:item="reason">
                            <li key={reason} class="reason-item">{reason}</li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <div class="empty-state">
                        <lightning-icon icon-name="utility:info" size="x-small" class="slds-p-right_x-small"></lightning-icon>
                        <span class="slds-text-body_small slds-text-color_weak">No eligible commission found for this record.</span>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

    <template lwc:if={showPaymentDateModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="payment-modal-heading" class="slds-modal slds-fade-in-open" data-action-mode="record-payment">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closePaymentDateModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="payment-modal-heading" class="slds-modal__title slds-hyphenate">Record Payment</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-p-bottom_small">
                        Recording a payment for <strong>{commissionName}</strong>. The remaining balance is pre-filled — you can edit it to record a partial payment.
                    </p>

                    <div class="slds-box slds-box_x-small slds-m-bottom_small slds-theme_shade">
                        <div class="slds-grid slds-wrap slds-gutters_x-small">
                            <div class="slds-col slds-size_1-of-3">
                                <div class="field-label">Total Commission</div>
                                <div class="field-value">
                                    <lightning-formatted-number value={totalCommissionAmount} format-style="currency" currency-code={currencyCode} minimum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <div class="field-label">Already Paid</div>
                                <div class="field-value">
                                    <lightning-formatted-number value={paidAmount} format-style="currency" currency-code={currencyCode} minimum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <div class="field-label">Remaining</div>
                                <div class="field-value amount-emphasis">
                                    <lightning-formatted-number value={remainingAmount} format-style="currency" currency-code={currencyCode} minimum-fraction-digits="2"></lightning-formatted-number>
                                </div>
                            </div>
                        </div>
                    </div>

                    <lightning-input
                        type="number"
                        label="Payment Amount"
                        value={paidAmountInput}
                        onchange={handlePaidAmountChange}
                        formatter="currency"
                        step="0.01"
                        min="0.01"
                        required
                        message-when-value-missing="Payment amount is required."
                        class="slds-p-bottom_x-small">
                    </lightning-input>
                    <lightning-input
                        type="date"
                        label="Payment Date"
                        value={paymentDate}
                        onchange={handlePaymentDateChange}
                        required
                        message-when-value-missing="Payment date is required."
                        class="slds-p-bottom_x-small">
                    </lightning-input>
                    <lightning-combobox
                        label="Payment Method"
                        value={selectedPaymentMethod}
                        options={paymentMethodOptions}
                        onchange={handlePaymentMethodChange}
                        placeholder="Select payment method"
                        required
                        message-when-value-missing="Payment method is required.">
                    </lightning-combobox>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closePaymentDateModal}>Cancel</button>
                    <button class="slds-button slds-button_brand slds-m-left_x-small" onclick={confirmMarkAsPaid} disabled={generating}>Record Payment</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template lwc:if={showGenerateModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="generate-modal-heading" class="slds-modal slds-fade-in-open" data-action-mode="generate-invoice">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeGenerateModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="generate-modal-heading" class="slds-modal__title slds-hyphenate">Generate Invoice</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-p-bottom_small">
                        Generating an invoice for <strong>{commissionName}</strong>. Select the bank account that should appear on the invoice.
                    </p>
                    <lightning-record-picker
                        label="Bank"
                        placeholder="Search Bank..."
                        object-api-name="Financial_Detail__c"
                        value={selectedFinancialDetailId}
                        onchange={handleFinancialDetailChange}>
                    </lightning-record-picker>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeGenerateModal}>Cancel</button>
                    <button class="slds-button slds-button_brand slds-m-left_x-small" onclick={submitGenerate} disabled={generating}>Generate</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
