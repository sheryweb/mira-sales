<template>
  <div class="generate-sales-offer-container" style="margin-left: 10px">
    <button
      type="button"
      onclick={generate}
      class="slds-button slds-button_outline-brand"
      disabled={showSpinner}
    >
      <div
        class="demo-only"
        style="position: static; display: flex; justify-content: end"
      >
        <template if:true={showSpinner}>
          <div>
            <div
              role="status"
              style="position: relative; margin-right: 15px"
              class="slds-spinner slds-spinner_x-small slds-spinner"
            >
              <span class="slds-assistive-text">Loading</span>
              <div class="slds-spinner__dot-a"></div>
              <div class="slds-spinner__dot-b"></div>
            </div>
          </div>
        </template>

        <div>Generate Sales Offer</div>
      </div>
    </button>

    <template if:true={showEmailAction}>
      <button
        type="button"
        onclick={openEmailBox}
        class="slds-button slds-button_outline-brand email-button"
        disabled={showSpinner}
      >
        <div>Email Sales Offer</div>
      </button>
    </template>
  </div>

  <template if:true={showEmailBox}>
    <div class="email-overlay" onclick={closeEmailBox}>
      <div class="email-box" onclick={stopClick}>
        <h3>Email the sales offer</h3>
        <p class="email-hint">The PDF will be sent as an attachment.</p>
        <lightning-input
          type="email"
          label="Send to"
          value={emailAddress}
          onchange={handleEmailChange}
        ></lightning-input>
        <div class="email-actions">
          <lightning-button
            label="Cancel"
            onclick={closeEmailBox}
          ></lightning-button>
          <lightning-button
            variant="brand"
            label="Send"
            icon-name="utility:send"
            onclick={sendEmail}
            disabled={showSpinner}
          ></lightning-button>
        </div>
      </div>
    </div>
  </template>
</template>
