<template>
    <lightning-card title="Invoice PDF" icon-name="standard:document">
        <div class="slds-p-around_medium">
            <lightning-button-group>
                <lightning-button
                    label="View PDF"
                    icon-name="utility:preview"
                    onclick={handleViewPDF}
                    disabled={isLoading}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Tax Invoice"
                    icon-name="utility:money"
                    onclick={handleViewTaxInvoice}
                    disabled={isLoading}>
                </lightning-button>
            </lightning-button-group>
            
            <div if:true={isLoading} class="slds-p-top_small">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </div>
    </lightning-card>
</template>
