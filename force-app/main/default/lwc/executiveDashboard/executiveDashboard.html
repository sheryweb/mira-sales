<template>
    <div class="dashboard">
        <header class="panel header">
            <div class="header-text">
                <h1 class="title">Executive Management Dashboard</h1>
                <p class="subtitle">{subtitle}</p>
            </div>
            <div class="header-controls">
                <span class="updated-label">{lastUpdatedLabel}</span>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    variant="border-filled"
                    alternative-text="Refresh dashboard"
                    title="Refresh"
                    onclick={handleRefresh}
                ></lightning-button-icon>
                <lightning-combobox
                    name="targetYear"
                    label="Target Year"
                    variant="label-hidden"
                    value={selectedYear}
                    options={yearOptions}
                    onchange={handleYearChange}
                    class="year-picker"
                ></lightning-combobox>
            </div>
        </header>

        <template lwc:if={hasError}>
            <div class="panel error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span class="error-text">{errorMessage}</span>
            </div>
        </template>

        <div class="chart-grid">
            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">YTD Sales vs Target</h2>
                    <span class="chart-scope">Sold</span>
                </header>
                <div class="gauge-wrap">
                    <div class="gauge-canvas-box">
                        <canvas class="gauge-canvas"></canvas>
                    </div>
                    <div class="gauge-value">
                        <span class={gaugeTile.valueClass} title={gaugeTile.full}>{gaugeTile.compact}</span>
                        <span class="gauge-value-sub">{gaugeTile.target}</span>
                    </div>
                </div>
            </article>

            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Monthly Sold Value</h2>
                    <span class="chart-scope">Sold · by sold month</span>
                </header>
                <div class="chart-wrap">
                    <canvas class="monthly-canvas"></canvas>
                    <template lwc:if={hasNoMonthly}>
                        <p class="chart-empty">No sold deals in this cohort yet</p>
                    </template>
                </div>
            </article>

            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Quarterly Sold Value</h2>
                    <span class="chart-scope">Sold · by booking quarter</span>
                </header>
                <div class="chart-wrap">
                    <canvas class="quarterly-canvas"></canvas>
                    <template lwc:if={hasNoQuarterly}>
                        <p class="chart-empty">No sold deals in this cohort yet</p>
                    </template>
                </div>
            </article>

            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Project Sold Value</h2>
                    <span class="chart-scope">Sold · by project</span>
                </header>
                <div class="donut-wrap">
                    <canvas class="project-canvas"></canvas>
                    <template lwc:if={hasNoProjects}>
                        <p class="chart-empty">No sold deals in this cohort yet</p>
                    </template>
                    <template lwc:else>
                        <div class="donut-center" aria-hidden="true">
                            <span class="donut-center-value">{donutCenter}</span>
                            <span class="donut-center-label">Sold</span>
                        </div>
                    </template>
                </div>
            </article>
        </div>

        <div class="tile-grid">
            <article class={unitsTile.cardClass}>
                <p class="tile-label">Total Units</p>
                <span class="tile-scope">Booked / Reserved / Sold</span>
                <p class="tile-hero">{unitsTile.display}</p>
                <p class="tile-full">deals in the cohort</p>
            </article>
            <article class={valueTile.cardClass}>
                <p class="tile-label">Total Value</p>
                <span class="tile-scope">Reserved / Sold</span>
                <p class="tile-hero" title={valueTile.full}>{valueTile.compact}</p>
                <p class="tile-full">{valueTile.full}</p>
            </article>
        </div>

        <div class="table-grid">
            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Pipeline by Stage</h2>
                    <span class="chart-scope">Booked / Reserved / Sold</span>
                </header>
                <template lwc:if={pipelineTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Stage</th>
                                    <th scope="col" class="num">Sum of Units</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={pipelineTable.rows} for:item="row">
                                    <tr key={row.key}>
                                        <th scope="row" class="name-cell">{row.name}</th>
                                        <td class="num">{row.units}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th scope="row">Total</th>
                                    <td class="num">{pipelineTable.totalUnits}</td>
                                    <td class="num">{pipelineTable.totalValue}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No deals in this cohort</p></template>
            </article>

            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Project Breakdown Report</h2>
                    <span class="chart-scope">All stages · incl. resells</span>
                </header>
                <template lwc:if={breakdownTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Project Name</th>
                                    <th scope="col">Stage</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={breakdownTable.rows} for:item="row">
                                    <tr key={row.key} class={row.rowClass}>
                                        <th scope="row" class="name-cell">{row.project}</th>
                                        <td>{row.stage}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No deals in this cohort</p></template>
            </article>

            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Top Nationalities by Sold Value</h2>
                    <span class="chart-scope">Sold</span>
                </header>
                <template lwc:if={nationalityTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Nationality</th>
                                    <th scope="col" class="num">Sum of Units</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={nationalityTable.rows} for:item="row">
                                    <tr key={row.key}>
                                        <th scope="row" class="name-cell">{row.name}</th>
                                        <td class="num">{row.units}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No sold deals with nationality in this cohort</p></template>
            </article>

            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Top 10 Broker Agencies by Value</h2>
                    <span class="chart-scope">Sold · agent-assisted</span>
                </header>
                <template lwc:if={agencyTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Agency</th>
                                    <th scope="col" class="num">Sum of Units</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={agencyTable.rows} for:item="row">
                                    <tr key={row.key}>
                                        <th scope="row" class="name-cell">{row.name}</th>
                                        <td class="num">{row.units}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No agency-assisted sold deals in this cohort</p></template>
            </article>

            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Sales Team Performance</h2>
                    <span class="chart-scope">Sold</span>
                </header>
                <template lwc:if={salesTeamTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Owner Name</th>
                                    <th scope="col" class="num">Sum of Units</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={salesTeamTable.rows} for:item="row">
                                    <tr key={row.key}>
                                        <th scope="row" class="name-cell">{row.name}</th>
                                        <td class="num">{row.units}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No sold deals in this cohort</p></template>
            </article>

            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Managers Team Performance</h2>
                    <span class="chart-scope">Sold</span>
                </header>
                <template lwc:if={managerTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Manager</th>
                                    <th scope="col" class="num">Sum of Units</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={managerTable.rows} for:item="row">
                                    <tr key={row.key}>
                                        <th scope="row" class="name-cell">{row.name}</th>
                                        <td class="num">{row.units}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No manager-assigned sold deals in this cohort</p></template>
            </article>

            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Monthly Booked Value</h2>
                    <span class="chart-scope">Booked / Reserved / Sold</span>
                </header>
                <template lwc:if={monthlyBookedTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Unit Booked Date</th>
                                    <th scope="col" class="num">Sum of Units</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={monthlyBookedTable.rows} for:item="row">
                                    <tr key={row.key}>
                                        <th scope="row" class="name-cell">{row.name}</th>
                                        <td class="num">{row.units}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th scope="row">Total</th>
                                    <td class="num">{monthlyBookedTable.totalUnits}</td>
                                    <td class="num">{monthlyBookedTable.totalValue}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No deals in this cohort</p></template>
            </article>

            <article class="panel table-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Monthly Sold Value</h2>
                    <span class="chart-scope">Sold only</span>
                </header>
                <template lwc:if={monthlySoldTable.hasRows}>
                    <div class="table-scroll">
                        <table class="cmp-table">
                            <thead>
                                <tr>
                                    <th scope="col">Unit Sold Date</th>
                                    <th scope="col" class="num">Sum of Units</th>
                                    <th scope="col" class="num">Unit Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={monthlySoldTable.rows} for:item="row">
                                    <tr key={row.key}>
                                        <th scope="row" class="name-cell">{row.name}</th>
                                        <td class="num">{row.units}</td>
                                        <td class="num"><span class="val-chip">{row.value}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th scope="row">Total</th>
                                    <td class="num">{monthlySoldTable.totalUnits}</td>
                                    <td class="num">{monthlySoldTable.totalValue}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </template>
                <template lwc:else><p class="table-empty">No sold deals in this cohort</p></template>
            </article>
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading dashboard" size="medium"></lightning-spinner>
        </template>
    </div>
</template>
