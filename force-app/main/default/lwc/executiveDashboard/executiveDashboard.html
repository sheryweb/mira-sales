<template>
    <div class="dashboard">
        <header class="panel header">
            <div class="header-text">
                <h1 class="title">Executive Management Dashboard</h1>
                <p class="subtitle">{subtitle}</p>
            </div>
            <div class="header-controls">
                <span class="updated-label">{lastUpdatedLabel}</span>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    variant="border-filled"
                    alternative-text="Refresh dashboard"
                    title="Refresh"
                    onclick={handleRefresh}
                ></lightning-button-icon>
                <lightning-combobox
                    name="targetYear"
                    label="Target Year"
                    variant="label-hidden"
                    value={selectedYear}
                    options={yearOptions}
                    onchange={handleYearChange}
                    class="year-picker"
                ></lightning-combobox>
            </div>
        </header>

        <template lwc:if={hasError}>
            <div class="panel error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                <span class="error-text">{errorMessage}</span>
            </div>
        </template>

        <div class="chart-grid">
            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">YTD Sales vs Target</h2>
                    <span class="chart-scope">Sold</span>
                </header>
                <div class="gauge-wrap">
                    <canvas class="gauge-canvas"></canvas>
                    <div class="gauge-value" aria-hidden="true">
                        <span class="gauge-value-main" title={gaugeTile.full}>{gaugeTile.compact}</span>
                        <span class="gauge-value-sub">{gaugeTile.target}</span>
                    </div>
                </div>
            </article>

            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Monthly Sold Value</h2>
                    <span class="chart-scope">Sold · by sold month</span>
                </header>
                <div class="chart-wrap">
                    <canvas class="monthly-canvas"></canvas>
                    <template lwc:if={hasNoMonthly}>
                        <p class="chart-empty">No sold deals in this cohort yet</p>
                    </template>
                </div>
            </article>

            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Quarterly Sold Value</h2>
                    <span class="chart-scope">Sold · by booking quarter</span>
                </header>
                <div class="chart-wrap">
                    <canvas class="quarterly-canvas"></canvas>
                    <template lwc:if={hasNoQuarterly}>
                        <p class="chart-empty">No sold deals in this cohort yet</p>
                    </template>
                </div>
            </article>

            <article class="panel chart-card">
                <header class="chart-card-header">
                    <h2 class="chart-title">Project Sold Value</h2>
                    <span class="chart-scope">Sold · by project</span>
                </header>
                <div class="donut-wrap">
                    <canvas class="project-canvas"></canvas>
                    <template lwc:if={hasNoProjects}>
                        <p class="chart-empty">No sold deals in this cohort yet</p>
                    </template>
                    <template lwc:else>
                        <div class="donut-center" aria-hidden="true">
                            <span class="donut-center-value">{donutCenter}</span>
                            <span class="donut-center-label">Sold</span>
                        </div>
                    </template>
                </div>
            </article>
        </div>

        <div class="tile-grid">
            <article class={unitsTile.cardClass}>
                <p class="tile-label">Total Units</p>
                <span class="tile-scope">Booked / Reserved / Sold</span>
                <p class="tile-hero">{unitsTile.display}</p>
                <p class="tile-full">deals in the cohort</p>
            </article>
            <article class={valueTile.cardClass}>
                <p class="tile-label">Total Value</p>
                <span class="tile-scope">Reserved / Sold</span>
                <p class="tile-hero" title={valueTile.full}>{valueTile.compact}</p>
                <p class="tile-full">{valueTile.full}</p>
            </article>
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading dashboard" size="medium"></lightning-spinner>
        </template>
    </div>
</template>
