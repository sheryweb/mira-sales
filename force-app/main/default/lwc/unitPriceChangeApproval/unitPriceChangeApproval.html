<template>
    <div class="slds-is-relative">
        <template if:true={loading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <!-- Pending approval banner (replaces button) -->
        <template if:true={isPendingApproval}>
            <div class="slds-box pending-status-box">
                <lightning-icon
                    icon-name="utility:clock"
                    size="small"
                    class="slds-m-right_x-small">
                </lightning-icon>
                <span class="slds-text-heading_small">Unit Price Change — Pending Approval</span>
                <span class="slds-m-left_small slds-text-body_regular slds-text-color_weak">
                    {approvalRequestName}
                </span>
                <a href={approvalRequestUrl} target="_blank" class="slds-m-left_small">
                    View Request &#x2197;
                </a>
            </div>
        </template>

        <!-- Request button (when no pending request) -->
        <template if:false={isPendingApproval}>
            <div class="slds-p-around_small">
                <lightning-button
                    variant="brand"
                    label="Request Unit Price Change"
                    icon-name="utility:moneybag"
                    onclick={handleOpenModal}
                    disabled={loading}>
                </lightning-button>
            </div>
        </template>
    </div>

    <!-- Main modal -->
    <template if:true={showMainModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                    <p class="slds-m-top_x-small slds-text-body_small">
                        <template if:true={info}>{info.unitTitle} &middot; {info.projectName}</template>
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:false={isEligible}>
                        <div class="slds-box slds-theme_warning slds-m-bottom_small">
                            Unit price changes are only allowed for Booked units.
                        </div>
                    </template>

                    <!-- Step 1: discount selection -->
                    <template if:false={isReviewStep}>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-text-title slds-text-color_weak">Current Price</div>
                                <div class="slds-text-heading_small">{currentPriceDisplay}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-text-title slds-text-color_weak">Current Cost (AED)</div>
                                <div class="slds-text-heading_small">{currentCostAedDisplay}</div>
                            </div>
                        </div>

                        <div class="slds-m-top_medium">
                            <lightning-combobox
                                label="Discount Percentage"
                                value={discountPercent}
                                placeholder="Select discount (1–10%)"
                                options={discountOptions}
                                required
                                disabled={isReadOnly}
                                onchange={handleDiscountChange}>
                            </lightning-combobox>
                        </div>

                        <div class="slds-m-top_medium">
                            <lightning-textarea
                                label="Justification"
                                value={justification}
                                placeholder="Explain why this price change is needed (min. 10 characters)"
                                required
                                disabled={isReadOnly}
                                onchange={handleJustificationChange}>
                            </lightning-textarea>
                        </div>
                    </template>

                    <!-- Step 2: review before submit -->
                    <template if:true={isReviewStep}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <p class="slds-text-body_regular">
                                Please review the calculated price before submitting for approval.
                            </p>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Discount</div>
                                <div class="slds-text-heading_small">{discountPercentDisplay}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Current Price</div>
                                <div class="slds-text-heading_small">{currentPriceDisplay}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Proposed Price</div>
                                <div class="slds-text-heading_small slds-text-color_success">{proposedPriceDisplay}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Current Cost (AED)</div>
                                <div class="slds-text-heading_small">{currentCostAedDisplay}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-text-title slds-text-color_weak">Proposed Cost (AED)</div>
                                <div class="slds-text-heading_small slds-text-color_success">{proposedCostAedDisplay}</div>
                            </div>
                        </div>

                        <template if:true={isForeignCurrency}>
                            <div class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                                {conversionRateDisplay}
                            </div>
                        </template>

                        <div class="slds-m-top_medium">
                            <div class="slds-text-title slds-text-color_weak">Justification</div>
                            <div class="slds-text-body_regular slds-m-top_xx-small">{justification}</div>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <template if:false={isReviewStep}>
                        <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Continue"
                            class="slds-m-left_x-small"
                            onclick={handleContinueToReview}
                            disabled={disableContinue}>
                        </lightning-button>
                    </template>
                    <template if:true={isReviewStep}>
                        <lightning-button label="Back" onclick={handleBackFromReview}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Submit for Approval"
                            class="slds-m-left_x-small"
                            onclick={handleSubmitForApproval}
                            disabled={disableSubmit}>
                        </lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
