<template>
    <template if:true={engineEnabled}>
    <lightning-card title="Receipt PDF" icon-name="standard:document">
        <div class="slds-p-around_medium">
            <lightning-button-group>
                <lightning-button 
                    label="View PDF" 
                    icon-name="utility:preview" 
                    onclick={handleViewPDF}
                    disabled={isLoading}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button 
                    label="Attach to Record" 
                    icon-name="utility:attach" 
                    onclick={handleAttachPDF}
                    disabled={isLoading}>
                </lightning-button>
            </lightning-button-group>
            
            <div if:true={isLoading} class="slds-p-top_small">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </div>
    </lightning-card>
    </template>
</template>
