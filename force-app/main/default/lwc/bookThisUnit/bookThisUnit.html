<template>
    <lightning-button
        label="Book this Unit"
        icon-name="utility:event"
        variant="brand"
        onclick={handleOpenModal}
        title="Book this Unit">
    </lightning-button>

    <!-- Modal -->
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-labelledby="book-unit-modal-heading"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-container-tall">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse close-btn-with-x"
                        title="Close"
                        onclick={handleCloseModal}>
                        <span class="close-x" aria-hidden="true">×</span>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="book-unit-modal-heading" class="slds-text-heading_medium slds-hyphenate">
                        Book this Unit
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Step 1: Selection Form -->
                    <template if:true={isStep1}>
                    <!-- Select Client Lookup -->
                    <div class="slds-form-element slds-m-bottom_medium">
                        <label class="slds-form-element__label">Select Client</label>
                        <div class="slds-form-element__control">
                            <div class="slds-combobox_container">
                                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right">
                                        <template if:true={selectedClient}>
                                            <div class="slds-pill_container">
                                                <lightning-pill
                                                    label={selectedClient.Name}
                                                    onremove={handleClearClient}
                                                    class="slds-pill">
                                                </lightning-pill>
                                            </div>
                                        </template>
                                        <template if:false={selectedClient}>
                                            <input
                                                type="text"
                                                class="slds-input slds-combobox__input"
                                                placeholder="Search clients..."
                                                value={clientSearchKey}
                                                oninput={handleClientSearch}
                                                onfocus={handleClientFocus}
                                                data-field="client-search"
                                                autocomplete="off"/>
                                            <template if:true={clientSearching}>
                                                <div class="slds-input__icon-group slds-input__icon-group_right">
                                                    <div class="slds-spinner slds-spinner_brand slds-spinner_x-small" role="status">
                                                        <span class="slds-assistive-text">Loading</span>
                                                        <div class="slds-spinner__dot-a"></div>
                                                        <div class="slds-spinner__dot-b"></div>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                    <template if:true={showClientResults}>
                                        <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid">
                                            <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                                                <template for:each={clientRecords} for:item="record">
                                                    <li key={record.Id} role="presentation" class="slds-listbox__item">
                                                        <div
                                                            class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                                            role="option"
                                                            data-id={record.Id}
                                                            data-name={record.Name}
                                                            onclick={handleSelectClient}>
                                                            <span class="slds-media__figure">
                                                                <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                                            </span>
                                                            <span class="slds-media__body">
                                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{record.Name}</span>
                                                            </span>
                                                        </div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Assisted By Agent Checkbox -->
                    <div class="slds-form-element slds-m-bottom_medium">
                        <div class="slds-form-element__control">
                            <lightning-input
                                type="checkbox"
                                label="Assisted By Agent"
                                checked={assistedByAgent}
                                onchange={handleAssistedByAgentChange}>
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Agency and Agent Lookups (shown when Assisted By Agent is checked) -->
                    <template if:true={assistedByAgent}>
                        <!-- Agency Lookup -->
                        <div class="slds-form-element slds-m-bottom_medium">
                            <label class="slds-form-element__label">Agency</label>
                            <div class="slds-form-element__control">
                                <div class="slds-combobox_container">
                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right">
                                            <template if:true={selectedAgency}>
                                                <div class="slds-pill_container">
                                                    <lightning-pill
                                                        label={selectedAgency.Name}
                                                        onremove={handleClearAgency}
                                                        class="slds-pill">
                                                    </lightning-pill>
                                                </div>
                                            </template>
                                            <template if:false={selectedAgency}>
                                                <input
                                                    type="text"
                                                    class="slds-input slds-combobox__input"
                                                    placeholder="Search agencies..."
                                                    value={agencySearchKey}
                                                    oninput={handleAgencySearch}
                                                    onfocus={handleAgencyFocus}
                                                    data-field="agency-search"
                                                    autocomplete="off"/>
                                                <template if:true={agencySearching}>
                                                    <div class="slds-input__icon-group slds-input__icon-group_right">
                                                        <div class="slds-spinner slds-spinner_brand slds-spinner_x-small" role="status">
                                                            <span class="slds-assistive-text">Loading</span>
                                                            <div class="slds-spinner__dot-a"></div>
                                                            <div class="slds-spinner__dot-b"></div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </template>
                                        </div>
                                        <template if:true={showAgencyResults}>
                                            <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid">
                                                <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                                                    <template for:each={agencyRecords} for:item="record">
                                                        <li key={record.Id} role="presentation" class="slds-listbox__item">
                                                            <div
                                                                class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                                                role="option"
                                                                data-id={record.Id}
                                                                data-name={record.Name}
                                                                onclick={handleSelectAgency}>
                                                                <span class="slds-media__figure">
                                                                    <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                                                </span>
                                                                <span class="slds-media__body">
                                                                    <span class="slds-listbox__option-text slds-listbox__option-text_entity">{record.Name}</span>
                                                                </span>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Agent Lookup (Contacts from selected Agency) -->
                        <div class="slds-form-element slds-m-bottom_medium">
                            <label class="slds-form-element__label">Agent</label>
                            <div class="slds-form-element__control">
                                <div class="slds-combobox_container">
                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right">
                                            <template if:true={selectedAgent}>
                                                <div class="slds-pill_container">
                                                    <lightning-pill
                                                        label={selectedAgent.Name}
                                                        onremove={handleClearAgent}
                                                        class="slds-pill">
                                                    </lightning-pill>
                                                </div>
                                            </template>
                                            <template if:false={selectedAgent}>
                                                <input
                                                    type="text"
                                                    class="slds-input slds-combobox__input"
                                                    placeholder={agentPlaceholder}
                                                    value={agentSearchKey}
                                                    oninput={handleAgentSearch}
                                                    onfocus={handleAgentFocus}
                                                    disabled={agentLookupDisabled}
                                                    data-field="agent-search"
                                                    autocomplete="off"/>
                                                <template if:true={agentSearching}>
                                                    <div class="slds-input__icon-group slds-input__icon-group_right">
                                                        <div class="slds-spinner slds-spinner_brand slds-spinner_x-small" role="status">
                                                            <span class="slds-assistive-text">Loading</span>
                                                            <div class="slds-spinner__dot-a"></div>
                                                            <div class="slds-spinner__dot-b"></div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </template>
                                        </div>
                                        <template if:true={showAgentResults}>
                                            <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid">
                                                <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                                                    <template for:each={agentRecords} for:item="record">
                                                        <li key={record.Id} role="presentation" class="slds-listbox__item">
                                                            <div
                                                                class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                                                role="option"
                                                                data-id={record.Id}
                                                                data-name={record.Name}
                                                                onclick={handleSelectAgent}>
                                                                <span class="slds-media__figure">
                                                                    <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                                                                </span>
                                                                <span class="slds-media__body">
                                                                    <span class="slds-listbox__option-text slds-listbox__option-text_entity">{record.Name}</span>
                                                                </span>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                    </template>

                    <!-- Step 2: Summary -->
                    <template if:true={isStep2}>
                        <div class="slds-text-heading_small slds-m-bottom_medium">Please review your selection</div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label">Client</dt>
                                    <dd class="slds-dl_horizontal__detail">{clientDisplayName}</dd>
                                </dl>
                            </div>
                            <template if:true={assistedByAgent}>
                                <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                    <dl class="slds-dl_horizontal">
                                        <dt class="slds-dl_horizontal__label">Agency</dt>
                                        <dd class="slds-dl_horizontal__detail">{agencyDisplayName}</dd>
                                    </dl>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                    <dl class="slds-dl_horizontal">
                                        <dt class="slds-dl_horizontal__label">Agent</dt>
                                        <dd class="slds-dl_horizontal__detail">{agentDisplayName}</dd>
                                    </dl>
                                </div>
                            </template>
                            <div class="slds-col slds-size_1-of-1">
                                <dl class="slds-dl_horizontal">
                                    <dt class="slds-dl_horizontal__label">Assisted by Agent</dt>
                                    <dd class="slds-dl_horizontal__detail">{assistedByAgentYesNo}</dd>
                                </dl>
                            </div>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        onclick={handleCloseModal}>
                    </lightning-button>
                    <template if:true={isStep2}>
                        <lightning-button
                            label="Back"
                            variant="neutral"
                            onclick={handleBack}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </template>
                    <lightning-button
                        label={isConfirmButtonLabel}
                        variant="brand"
                        onclick={handleConfirmOrNext}
                        disabled={isNextButtonDisabled}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
