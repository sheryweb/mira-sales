<template>
    <div class="slds-is-relative">
        <template if:true={loading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <template if:true={isPendingApproval}>
            <div class="slds-box pending-status-box">
                <lightning-icon
                    icon-name="utility:clock"
                    size="small"
                    class="slds-m-right_x-small">
                </lightning-icon>
                <span class="slds-text-heading_small">Share Deal — Pending Approval</span>
                <span class="slds-m-left_small slds-text-body_regular slds-text-color_weak">
                    {approvalRequestName}
                </span>
                <a href={approvalRequestUrl} target="_blank" class="slds-m-left_small">
                    View Request &#x2197;
                </a>
            </div>
        </template>

        <template if:false={isPendingApproval}>
            <template if:true={isAlreadyShareDeal}>
                <div class="slds-box approved-status-box">
                    <lightning-icon
                        icon-name="utility:groups"
                        size="small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <span class="slds-text-heading_small">Share Deal</span>
                    <span class="slds-m-left_small slds-text-body_regular">
                        50/50 with {info.sharedRmName}
                    </span>
                    <lightning-button
                        variant="neutral"
                        label="Change Shared RM"
                        class="slds-m-left_small"
                        onclick={handleOpenModal}
                        disabled={loading}>
                    </lightning-button>
                </div>
            </template>
            <template if:false={isAlreadyShareDeal}>
                <div class="slds-p-around_small">
                    <lightning-button
                        variant="brand"
                        label="Request Share Deal"
                        icon-name="utility:groups"
                        onclick={handleOpenModal}
                        disabled={loading}>
                    </lightning-button>
                </div>
            </template>
        </template>
    </div>

    <template if:true={showMainModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                    <p class="slds-m-top_x-small slds-text-body_small">
                        <template if:true={info}>{info.opportunityName} &middot; Owner: {info.ownerName}</template>
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:false={isEligible}>
                        <div class="slds-box slds-theme_warning slds-m-bottom_small">
                            {ineligibleReason}
                        </div>
                    </template>

                    <template if:true={isAlreadyShareDeal}>
                        <div class="slds-box slds-theme_info slds-m-bottom_small">
                            This Opportunity is already a Share Deal with {info.sharedRmName}.
                            Submitting will request a change to the Shared RM.
                        </div>
                    </template>

                    <template if:false={isReviewStep}>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-text-title slds-text-color_weak">Unit Price</div>
                                <div class="slds-text-heading_small">{unitPriceDisplay}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-text-title slds-text-color_weak">Each RM Credit (50%)</div>
                                <div class="slds-text-heading_small">{creditAmountDisplay}</div>
                            </div>
                        </div>

                        <div class="slds-m-top_medium">
                            <lightning-combobox
                                label="Shared RM"
                                value={selectedSharedRmId}
                                placeholder="Select the second RM"
                                options={rmOptions}
                                required
                                disabled={isReadOnly}
                                onchange={handleSharedRmChange}>
                            </lightning-combobox>
                        </div>

                        <div class="slds-m-top_medium">
                            <lightning-textarea
                                label="Justification"
                                value={justification}
                                placeholder="Explain why this deal should be shared (min. 10 characters)"
                                required
                                disabled={isReadOnly}
                                onchange={handleJustificationChange}>
                            </lightning-textarea>
                        </div>
                    </template>

                    <template if:true={isReviewStep}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <p class="slds-text-body_regular">
                                Please confirm the 50/50 Share Deal before submitting for approval.
                            </p>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Primary RM (Owner)</div>
                                <div class="slds-text-heading_small">{info.ownerName}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Shared RM</div>
                                <div class="slds-text-heading_small">{selectedSharedRmName}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Unit Price</div>
                                <div class="slds-text-heading_small">{unitPriceDisplay}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <div class="slds-text-title slds-text-color_weak">Credit Each (50%)</div>
                                <div class="slds-text-heading_small slds-text-color_success">{creditAmountDisplay}</div>
                            </div>
                        </div>

                        <div class="slds-m-top_medium">
                            <div class="slds-text-title slds-text-color_weak">Justification</div>
                            <div class="slds-text-body_regular slds-m-top_xx-small">{justification}</div>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <template if:false={isReviewStep}>
                        <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Continue"
                            class="slds-m-left_x-small"
                            onclick={handleContinueToReview}
                            disabled={disableContinue}>
                        </lightning-button>
                    </template>
                    <template if:true={isReviewStep}>
                        <lightning-button label="Back" onclick={handleBackFromReview}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Submit for Approval"
                            class="slds-m-left_x-small"
                            onclick={handleSubmitForApproval}
                            disabled={disableSubmit}>
                        </lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
