<template>
    <lightning-card title="Email Receipt" icon-name="standard:email">
        <div class="slds-p-around_medium">
            <lightning-button 
                label="Send to Customer" 
                icon-name="utility:email" 
                onclick={handleSendEmail}
                disabled={isLoading}
                variant="brand">
            </lightning-button>
            
            <div if:true={isLoading} class="slds-p-top_small">
                <lightning-spinner alternative-text="Sending Email" size="small"></lightning-spinner>
            </div>
            
            <div if:true={showSuccess} class="slds-p-top_small">
                <div class="slds-notify slds-notify_alert slds-alert_success" role="alert">
                    <span class="slds-assistive-text">Success</span>
                    <span class="slds-icon_container slds-icon-utility-success slds-m-right_x-small">
                        <lightning-icon icon-name="utility:success" size="small" variant="inverse"></lightning-icon>
                    </span>
                    <h2>Receipt email sent successfully!</h2>
                </div>
            </div>
        </div>
    </lightning-card>

    <!-- Confirmation Dialog -->
    <template if:true={showConfirmDialog}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Confirm Email Sending</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p>Are you sure you want to send this receipt to the customer?</p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleCancel}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={handleConfirm}>Yes, Send Email</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
